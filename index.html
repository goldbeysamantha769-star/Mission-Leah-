<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mission: Leah 💜</title>

<style>

/* =========================
   BASIC PAGE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02020b;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================
   SPACE BACKGROUND
========================= */

#space {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(91, 45, 160, 0.35),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(39, 60, 160, 0.3),
            transparent 40%
        ),

        radial-gradient(
            circle at 50% 50%,
            #120b35,
            #050414 50%,
            #010106 100%
        );
}


/* =========================
   STARS
========================= */

.star {

    position: absolute;

    width: 2px;
    height: 2px;

    background: white;

    border-radius: 50%;

    animation:
        twinkle
        var(--speed)
        infinite
        ease-in-out;

    opacity: 0.7;
}


@keyframes twinkle {

    0% {
        opacity: 0.2;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

    100% {
        opacity: 0.2;
        transform: scale(0.7);
    }

}


/* =========================
   BIG GLOWING STARS
========================= */

.big-star {

    position: absolute;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 8px white,
        0 0 20px #9b7cff,
        0 0 35px #674cff;

    animation:
        glow 4s infinite ease-in-out;

}


@keyframes glow {

    0% {
        opacity: 0.4;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.4;
    }

}


/* =========================
   SHOOTING STAR
========================= */

.shooting-star {

    position: absolute;

    width: 120px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white
        );

    transform: rotate(-35deg);

    opacity: 0;

    animation:
        shooting 7s infinite;

}


@keyframes shooting {

    0% {
        left: 110%;
        top: 5%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    25% {
        left: 60%;
        top: 35%;
        opacity: 0;
    }

    100% {
        left: 60%;
        top: 35%;
        opacity: 0;
    }

}


/* =========================
   INTRO SCREEN
========================= */

#intro {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

}


#intro.hidden {

    opacity: 0;

    transform: scale(2);

    pointer-events: none;

}


/* =========================
   INTRO CONTENT
========================= */

.container {

    width: 100%;

    max-width: 650px;

}


.mission-number {

    font-size: 11px;

    letter-spacing: 5px;

    color: #a89cff;

    margin-bottom: 25px;

    text-transform: uppercase;

}


h1 {

    margin: 0;

    font-size:
        clamp(
            45px,
            12vw,
            85px
        );

    letter-spacing: -3px;

    font-weight: 800;

    text-shadow:

        0 0 20px
        rgba(150, 120, 255, 0.4);

}


.subtitle {

    margin:

        20px
        auto
        35px;

    max-width: 500px;

    color: #c7c4d8;

    font-size: 16px;

    line-height: 1.8;

}


/* =========================
   LAUNCH BUTTON
========================= */

.launch-button {

    padding:
        16px
        30px;

    border-radius: 50px;

    border:
        1px solid
        #9b8cff;

    background:
        rgba(
            30,
            20,
            70,
            0.8
        );

    color: white;

    font-size: 16px;

    cursor: pointer;

    box-shadow:

        0 0 20px
        rgba(
            120,
            90,
            255,
            0.25
        );

    transition:
        transform 0.3s,
        box-shadow 0.3s,
        background 0.3s;

}


.launch-button:hover {

    transform: scale(1.07);

    background:
        rgba(
            50,
            35,
            110,
            0.9
        );

    box-shadow:

        0 0 25px
        rgba(
            130,
            100,
            255,
            0.7
        );

}


/* =========================
   SPACE CONTENT
========================= */

#universe {

    position: fixed;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    transition: opacity 2s;

}


#universe.active {

    opacity: 1;

   pointer-events: auto;

}


/* =========================
   CENTRAL STAR
========================= */

#central-star {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 90px;
    height: 90px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            white,
            #d7caff 20%,
            #8c69ff 55%,
            #3b2070
        );

    box-shadow:

        0 0 35px #aa8cff,
        0 0 80px #7654ff,
        0 0 140px
        rgba(
            120,
            80,
            255,
            0.35
        );

}


/* =========================
   MISSION TEXT
========================= */

.mission-label {

    position: fixed;

    top: 18px;
    left: 20px;

    font-size: 10px;

    letter-spacing: 2px;

    color: #aaa5c4;

}

/* =========================
   ORBITS
========================= */

.orbit {
   position: absolute;

   left: 50%;
   top: 50%;

   border: 1px solid rgba(180, 160, 255, 0.12);

   border-radius: 50%;

   transform:
      translate(-50%, -50%);

   pointer-events: none;
}

.orbit-one {

   width: 190px;
   height: 190px;

}

.orbit-two {
   width: 310px;
   height: 310px;

}

.orbit-three {
   width: 460px;
   height: 460px;

}
   
/* =========================
   PLANETS
========================= */

   .planet {
      position: absolute;

      border-radius: 50%;

      cursor: pointer;

      transition:
         transform 0.4s,
         box-shadow 0.4s;

   }

   .planet:hover {

      transform: scale(1.15);

   }

   /* PURPLE PLANET */

   .planet-one {

      width: 55px;
      height: 55px;

      left: 
         calc(50% - 155px);
      top:
         calc(50% - 27px);

      background:

         radial-gradient(
            circle at 35% 25%,
            #fff0ff,
            #c875ff 40%,
            #7137a5 70%,
            #25103b
            );

      box-shadow:

         0 0 20px #c26cff,
         0 0 45px rgba(180, 80, 255, 0.35);
   }

   /*BLUE PLANET */

   .planet-two {
      width: 44px;
      height: 44px;

      left: 
         calc(50% + 75px);

      top:
         calc(50% - 22px);

      background: 

         radial-gradient(
            circle at 30% 25%,
            #e8f7ff,
            #668fff 35%,
            #293c9b 65%,
            #101632
            );

      box-shadow:

         0 0 18px #668dff,
         0 0 40px rgba(70, 110, 255, 0.4);
   }

   /* RED PLANET */

   .planet-three {

      width: 68px;
      height: 68px;

      left: 
         calc(50% + 185px);

      top:
         calc(50% - 34px);

      background:

         radial-gradient(
            circle at 30% 25%,
            #ffd9df,
            #d55b77 35%,
            #74283f 65%,
            #270b17
            );

      box-shadow:

         0 0 20px #d85e7c,
         0 0 45px rgba(220, 70, 100, 0.3);
   } 

/* =========================
   MOON
========================= */

   .moon {

      position: absolute;

      width: 18px;
      height: 18px;

      left:
         calc(50% - 9px);

      top:
         calc(50% - 105px);

      border-radius: 50%;

      background:

         radial-gradient(
            circle at 30% 25%,
            white,
            #b8b5c9 50%,
            #555365
            );

      box-shadow:
         0 0 12px
         rgba(255, 255, 255, 0.6);

      cursor: pointer;

   }

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .subtitle {

        font-size: 15px;

    }

    #central-star {

        width: 70px;
        height: 70px;

    }

}

/* =========================
   DISCOVERY SCREEN
========================= */

   #discovery-screen {

      position: fixed;

      inset: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background:
         rgba(2, 2, 11, 0.92);

      backdrop-filter:
         blur(12px);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
         opacity 0.5s ease;
   }

   #discovery-screen.active {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;
   }

   .discovery-panel {
      width: 100%;

      max-width: 520px;

      padding: 35px 25px;

      text-align: center;

      border:
         1px solid
      rgba(170, 140, 255, 0.45);

      border-radius: 25px;

      background: 
         linear-gradient(
            145deg,
            rgba(35, 25, 75, 0.95),
            rgba(8, 8, 25, 0.97)
            );

      box-shadow:
         0 0 30px
      rgba(130, 90, 255, 0.25),
         inset 0 0 30px
      rgba(130, 90, 255, 0.05);

      transform: 
         translateY(20px)
      scale(0.95);

      transition: 
         transform 0.5s ease;
   }

   #discovery-screen.active.discovery-panel {

      transform: 
         translateY(0)
      scale(1);
   }

   .discovery-label {

      font-size: 10px;

      letter-spacing: 4px;

      color: #a89cff;

      margin-bottom: 18px;
   }
   
.discovery-panel h2 {

   margin: 0;

   font-size: 28px;

   letter-spacing: -1px;
}

   .discovery-line {

      width: 60px;

      height: 1px;

      margin: 20px auto;

      background: 
         #9b7cff;

      box-shadow:
         0 0 10px #9b7cff;
   }

   .discovery-panel p {

      color: #c7c4d8;

      font-size: 15px;

      line-height: 1.8;

      white-space: pre-line;
   }

   .close-discovery {

      margin-top: 20px;

      padding: 12px 22px;

      border-radius: 30px;

      border:
         1px solid
      #8e7cff;

      background:
         rgba(80, 60, 150, 0.25);

      color: white;

      font-size: 13px;

      cursor: pointer;
   }
   
</style>

</head>

<body>

<!-- =========================
     SPACE
========================= -->

<div id="space"></div>


<!-- SHOOTING STAR -->

<div class="shooting-star"></div>


<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="container">

        <div class="mission-number">

            NASA PERSONAL MISSION • 001

        </div>


        <h1>

            Mission: Leah 💜

        </h1>


        <p class="subtitle">

            Welcome to your universe Leah,
            there are a few things i wanted you to find.
         
         

        </p>


        <button
            class="launch-button"
            onclick="launchMission()">

            🚀 BEGIN MISSION

        </button>

    </div>

</section>


<!-- =========================
     UNIVERSE
========================= -->

<section id="universe">

    <div class="mission-label">

        MISSION: LEAH
        &nbsp;•&nbsp;
        STATUS: ACTIVE

    </div>


    <div 
       id="central-star"
       onclick="openPlanet('heart')">
          </div>
          
   <!-- PLANETS -->

<div class="orbit orbit-one"></div>

<div class="orbit orbit-two"></div>

<div class="orbit orbit-three"></div>


<!-- PLANET 1 -->

<div
    class="planet planet-one"
    onclick="openPlanet('memory')">

    <div class="planet-glow"></div>

</div>


<!-- PLANET 2 -->

<div
    class="planet planet-two"
    onclick="openPlanet('leah')">

    <div class="planet-glow"></div>

</div>


<!-- PLANET 3 -->

<div
    class="planet planet-three"
    onclick="openPlanet('music')">

    <div class="planet-glow"></div>

</div>


<!-- MOON -->

<div
    class="moon"
    onclick="openPlanet('moon')">

</div>

</section>

<!-- =========================
     DISCOVERY SCREEN
========================= -->

<div id="discovery-screen">

   <div class=discovery-panel">

      <div class="discovery-label"
         id="discovery-label">
         MISSION DISCOVERY
      </div>

      <h2 id="discovery-title">
         TITLE
      </h2>

      <div class="discovery-line"></div>

      <p id="discovery-message">
         MESSAGE
      </p>

      <button
         class="close-discovery"
         onlick="closeDiscovery()">

         RETURN TO UNIVERSE

      </button>

   </div>

</div>

<script>

/* =========================
   CREATE STARS
========================= */

const space = document.getElementById("space");

for (let i = 0; i < 220; i++) {

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.setProperty(
        "--speed",
        (2 + Math.random() * 5) + "s"
    );

    star.style.animationDelay =
        Math.random() * 5 + "s";

    space.appendChild(star);
}


/* =========================
   BIG STARS
========================= */

for (let i = 0; i < 18; i++) {

    const star = document.createElement("div");

    star.classList.add("big-star");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    space.appendChild(star);
}


/* =========================
   LAUNCH MISSION
========================= */

function launchMission() {

    const intro =
        document.getElementById("intro");

    const universe =
        document.getElementById("universe");

    intro.classList.add("hidden");

    setTimeout(function() {

        universe.classList.add("active");

    }, 700);

}


/* =========================
   DISCOVERY WINDOW
========================= */

function openDiscovery(label, title, message) {

   document.getElementById("discovery-label").textContent = label;

   document.getElementById("discovery-title").textContent = title;

   document.getElementById("discovery-message").textContent = message;

   document.getElementById("discovery-screen").classList.add("active");
}

   function closeDiscovery() {

      document.getElementById("discovery-screen").classList.remove("active");
   }



/* =========================
   PLANET INTERACTIONS
========================= */

function openPlanet(type) {


    if (type === "heart") {

        openDiscovery(
            "MISSION CORE",
            "THE HEART OF THE UNIVERSE",
            "Every mission needs a centre.\n\n" +
            "This universe has a very specific " +
            "reason for existing.\n\n" +
            "You.\n\n💜"
        );

    }


    if (type === "memory") {

        openDiscovery(
            "PLANET LEAH",
            "PERSONAL ARCHIVE",
            "You found something that was not " +
            "marked on the map.\n\n" +
            "This planet contains a collection " +
            "of things about you.\n\n" +
            "Some things are obvious.\n\n" +
            "Some things are tiny.\n\n" +
            "And some are things you probably " +
            "don't realise I've noticed.\n\n" +
            "Take your time exploring. 💜"
        );

    }


    if (type === "leah") {

        openDiscovery(
            "PLANET TWO",
            "THINGS I NOTICE",
            "The little things that make you, you.\n\n" +
            "This is where we'll put all the tiny " +
            "details that make Leah special. 💜"
        );

    }


    if (type === "music") {

        openDiscovery(
            "PLANET THREE",
            "YOUR SOUNDTRACK",
            "Every universe needs a soundtrack.\n\n" +
            "This is where your music, favourite " +
            "songs and memories will eventually live. 🎵"
        );

    }


    if (type === "moon") {

        openDiscovery(
            "FINAL TRANSMISSION",
            "THE MOON",
            "You found something hidden.\n\n" +
            "There is a message here that was " +
            "never meant to be found by just anyone.\n\n" +
            "🌙💜"
        );

    }

}

</script>

</body>

</html>
