<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mission: Leah 💜</title>

<style>

/* =========================
   BASIC PAGE
========================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02020b;
    color: white;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}


/* =========================
   SPACE BACKGROUND
========================= */

#space {

    position: fixed;

    inset: 0;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(91, 45, 160, 0.35),
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(39, 60, 160, 0.3),
            transparent 40%
        ),

        radial-gradient(
            circle at 50% 50%,
            #120b35,
            #050414 50%,
            #010106 100%
        );
}


/* =========================
   STARS
========================= */

.star {

    position: absolute;

    width: 2px;
    height: 2px;

    background: white;

    border-radius: 50%;

    animation:
        twinkle
        var(--speed)
        infinite
        ease-in-out;

    opacity: 0.7;
}


@keyframes twinkle {

    0% {
        opacity: 0.2;
        transform: scale(0.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.5);
    }

    100% {
        opacity: 0.2;
        transform: scale(0.7);
    }

}


/* =========================
   BIG GLOWING STARS
========================= */

.big-star {

    position: absolute;

    width: 5px;
    height: 5px;

    background: white;

    border-radius: 50%;

    box-shadow:
        0 0 8px white,
        0 0 20px #9b7cff,
        0 0 35px #674cff;

    animation:
        glow 4s infinite ease-in-out;

}


@keyframes glow {

    0% {
        opacity: 0.4;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.4;
    }

}


/* =========================
   SHOOTING STAR
========================= */

.shooting-star {

    position: absolute;

    width: 120px;
    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            white
        );

    transform: rotate(-35deg);

    opacity: 0;

    animation:
        shooting 7s infinite;

}


@keyframes shooting {

    0% {
        left: 110%;
        top: 5%;
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    25% {
        left: 60%;
        top: 35%;
        opacity: 0;
    }

    100% {
        left: 60%;
        top: 35%;
        opacity: 0;
    }

}


/* =========================
   INTRO SCREEN
========================= */

#intro {

    position: fixed;

    inset: 0;

    z-index: 10;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 25px;

    transition:
        opacity 1.5s ease,
        transform 1.5s ease;

}


#intro.hidden {

    opacity: 0;

    transform: scale(2);

    pointer-events: none;

}


/* =========================
   INTRO CONTENT
========================= */

.container {

    width: 100%;

    max-width: 650px;

}


.mission-number {

    font-size: 11px;

    letter-spacing: 5px;

    color: #a89cff;

    margin-bottom: 25px;

    text-transform: uppercase;

}


h1 {

    margin: 0;

    font-size:
        clamp(
            45px,
            12vw,
            85px
        );

    letter-spacing: -3px;

    font-weight: 800;

    text-shadow:

        0 0 20px
        rgba(150, 120, 255, 0.4);

}


.subtitle {

    margin:

        20px
        auto
        35px;

    max-width: 500px;

    color: #c7c4d8;

    font-size: 16px;

    line-height: 1.8;

}


/* =========================
   LAUNCH BUTTON
========================= */

.launch-button {

    padding:
        16px
        30px;

    border-radius: 50px;

    border:
        1px solid
        #9b8cff;

    background:
        rgba(
            30,
            20,
            70,
            0.8
        );

    color: white;

    font-size: 16px;

    cursor: pointer;

    box-shadow:

        0 0 20px
        rgba(
            120,
            90,
            255,
            0.25
        );

    transition:
        transform 0.3s,
        box-shadow 0.3s,
        background 0.3s;

}


.launch-button:hover {

    transform: scale(1.07);

    background:
        rgba(
            50,
            35,
            110,
            0.9
        );

    box-shadow:

        0 0 25px
        rgba(
            130,
            100,
            255,
            0.7
        );

}


/* =========================
   SPACE CONTENT
========================= */

#universe {

    position: fixed;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    transition: opacity 2s;

}


#universe.active {

    opacity: 1;

   pointer-events: auto;

}


/* =========================
   CENTRAL STAR
========================= */

#central-star {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 90px;
    height: 90px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:

        radial-gradient(
            circle at 35% 30%,
            white,
            #d7caff 20%,
            #8c69ff 55%,
            #3b2070
        );

    box-shadow:

        0 0 35px #aa8cff,
        0 0 80px #7654ff,
        0 0 140px
        rgba(
            120,
            80,
            255,
            0.35
        );

}


/* =========================
   MISSION TEXT
========================= */

.mission-label {

    position: fixed;

    top: 18px;
    left: 20px;

    font-size: 10px;

    letter-spacing: 2px;

    color: #aaa5c4;

}

/* =========================
   ORBITS
========================= */

.orbit {
   position: absolute;

   left: 50%;
   top: 50%;

   border: 1px solid rgba(180, 160, 255, 0.12);

   border-radius: 50%;

   transform:
      translate(-50%, -50%);

   pointer-events: none;
}

.orbit-one {

   width: 190px;
   height: 190px;

}

.orbit-two {
   width: 310px;
   height: 310px;

}

.orbit-three {
   width: 460px;
   height: 460px;

}
   
/* =========================
   PLANETS
========================= */

   .planet {
      position: absolute;

      border-radius: 50%;

      cursor: pointer;

      transition:
         transform 0.4s,
         box-shadow 0.4s;

   }

   .planet:hover {

      transform: scale(1.15);

   }

   /* PURPLE PLANET */

   .planet-one {

      width: 55px;
      height: 55px;

      left: 
         calc(50% - 155px);
      top:
         calc(50% - 27px);

      background:

         radial-gradient(
            circle at 35% 25%,
            #fff0ff,
            #c875ff 40%,
            #7137a5 70%,
            #25103b
            );

      box-shadow:

         0 0 20px #c26cff,
         0 0 45px rgba(180, 80, 255, 0.35);
   }

   /*BLUE PLANET */

   .planet-two {
      width: 44px;
      height: 44px;

      left: 
         calc(50% + 75px);

      top:
         calc(50% - 22px);

      background: 

         radial-gradient(
            circle at 30% 25%,
            #e8f7ff,
            #668fff 35%,
            #293c9b 65%,
            #101632
            );

      box-shadow:

         0 0 18px #668dff,
         0 0 40px rgba(70, 110, 255, 0.4);
   }

   /* RED PLANET */

   .planet-three {

      width: 68px;
      height: 68px;

      left: 
         calc(50% + 185px);

      top:
         calc(50% - 34px);

      background:

         radial-gradient(
            circle at 30% 25%,
            #ffd9df,
            #d55b77 35%,
            #74283f 65%,
            #270b17
            );

      box-shadow:

         0 0 20px #d85e7c,
         0 0 45px rgba(220, 70, 100, 0.3);
   } 

/* =========================
   MOON
========================= */

   .moon {

      position: absolute;

      width: 18px;
      height: 18px;

      left:
         calc(50% - 9px);

      top:
         calc(50% - 105px);

      border-radius: 50%;

      background:

         radial-gradient(
            circle at 30% 25%,
            white,
            #b8b5c9 50%,
            #555365
            );

      box-shadow:
         0 0 12px
         rgba(255, 255, 255, 0.6);

      cursor: pointer;

   }

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .subtitle {

        font-size: 15px;

    }

    #central-star {

        width: 70px;
        height: 70px;

    }

}

/* =========================
   DISCOVERY SCREEN
========================= */

   #discovery-screen {

      position: fixed;

      inset: 0;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background:
         rgba(2, 2, 11, 0.92);

      backdrop-filter:
         blur(12px);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
         opacity 0.5s ease;
   }

   #discovery-screen.active {

      opacity: 1;

      visibility: visible;

      pointer-events: auto;
   }

   .discovery-panel {
      width: 100%;

      max-width: 520px;

      padding: 35px 25px;

      text-align: center;

      border:
         1px solid
      rgba(170, 140, 255, 0.45);

      border-radius: 25px;

      background: 
         linear-gradient(
            145deg,
            rgba(35, 25, 75, 0.95),
            rgba(8, 8, 25, 0.97)
            );

      box-shadow:
         0 0 30px
      rgba(130, 90, 255, 0.25),
         inset 0 0 30px
      rgba(130, 90, 255, 0.05);

      transform: 
         translateY(20px)
      scale(0.95);

      transition: 
         transform 0.5s ease;
   }

   #discovery-screen.active.discovery-panel {

      transform: 
         translateY(0)
      scale(1);
   }

   .discovery-label {

      font-size: 10px;

      letter-spacing: 4px;

      color: #a89cff;

      margin-bottom: 18px;
   }
   
.discovery-panel h2 {

   margin: 0;

   font-size: 28px;

   letter-spacing: -1px;
}

   .discovery-line {

      width: 60px;

      height: 1px;

      margin: 20px auto;

      background: 
         #9b7cff;

      box-shadow:
         0 0 10px #9b7cff;
   }

   .discovery-panel p {

      color: #c7c4d8;

      font-size: 15px;

      line-height: 1.8;

      white-space: pre-line;
   }

   .close-discovery {

      margin-top: 20px;

      padding: 12px 22px;

      border-radius: 30px;

      border:
         1px solid
      #8e7cff;

      background:
         rgba(80, 60, 150, 0.25);

      color: white;

      font-size: 13px;

      cursor: pointer;
   }

   /* =========================
   PERSONAL ARCHIVE
========================= */

#personal-archive {
    display: none;
}

#personal-archive.active {
    display: block;
}

.archive-intro {
    color: #aaa5c4;
    font-size: 11px;
    letter-spacing: 3px;
    line-height: 2;
    margin-bottom: 25px;
}

.archive-intro span {
    font-size: 28px;
}

.archive-intro small {
    color: #77728f;
    font-size: 8px;
    letter-spacing: 2px;
}


.archive-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}


.archive-item {
    min-height: 90px;

    border:
        1px solid
        rgba(170, 140, 255, 0.25);

    border-radius: 18px;

    background:
        rgba(100, 75, 170, 0.12);

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 8px;

    font-size: 22px;

    cursor: pointer;

    transition:
        transform 0.3s ease,
        background 0.3s ease,
        box-shadow 0.3s ease;
}


.archive-item span {
    font-size: 9px;
    letter-spacing: 1.5px;
    color: #c7c4d8;
}


.archive-item:hover {
    transform: translateY(-3px);

    background:
        rgba(130, 100, 220, 0.25);

    box-shadow:
        0 0 18px
        rgba(140, 100, 255, 0.2);
}


/* LOCKED DISCOVERIES */

.archive-item.locked {
    opacity: 0.45;

    border-color:
        rgba(130, 120, 160, 0.15);

    background:
        rgba(40, 35, 65, 0.2);
}


.archive-item.locked span {
    color: #77728f;
}


/* CLASSIFIED */

.archive-item.classified {
    border-color:
        rgba(210, 170, 255, 0.4);

    background:
        rgba(120, 70, 160, 0.15);
}


/* MOBILE */

@media (max-width: 600px) {

    .archive-grid {
        gap: 9px;
    }

    .archive-item {
        min-height: 80px;
    }

}

   /* =========================
   PINK PLANET UNIVERSE
========================= */

#pink-universe {

    position: fixed;

    inset: 0;

    z-index: 40;

    opacity: 0;

    visibility: hidden;

    pointer-events: none;

    overflow: hidden;

    background:

        radial-gradient(
            circle at 25% 25%,
            rgba(255, 120, 210, 0.35),
            transparent 35%
        ),

        radial-gradient(
            circle at 75% 70%,
            rgba(140, 90, 255, 0.35),
            transparent 40%
        ),

        radial-gradient(
            circle at 50% 50%,
            #351642,
            #12091d 55%,
            #05030a 100%
        );

    transition:
        opacity 0.8s ease;
}


#pink-universe.active {

    opacity: 1;

    visibility: visible;

    pointer-events: auto;
}


/* TITLE */

.pink-universe-title {

    position: absolute;

    top: 35px;

    left: 0;
    right: 0;

    text-align: center;

    font-size: 11px;

    letter-spacing: 4px;

    color: #f4b7e8;

}


/* SUBTITLE */

.pink-universe-subtitle {

    position: absolute;

    top: 62px;

    left: 20px;
    right: 20px;

    text-align: center;

    color: #d8c4df;

    font-size: 14px;

}


/* RETURN BUTTON */

.pink-back-button {

    position: absolute;

    bottom: 25px;

    left: 50%;

    transform: translateX(-50%);

    padding: 11px 22px;

    border-radius: 30px;

    border:
        1px solid
        rgba(255, 180, 235, 0.5);

    background:
        rgba(40, 15, 50, 0.7);

    color: white;

    font-size: 13px;

    cursor: pointer;

    backdrop-filter: blur(8px);
}

   /* =========================
   PINK PLANET DISCOVERIES
========================= */

.pink-discovery {

    position: absolute;

    display: flex;

    align-items: center;

    justify-content: center;

    width: 58px;
    height: 58px;

    border-radius: 50%;

    font-size: 28px;

    cursor: pointer;

    background:
        rgba(255, 210, 245, 0.08);

    border:
        1px solid
        rgba(255, 190, 240, 0.35);

    box-shadow:
        0 0 15px
        rgba(255, 150, 230, 0.35),
        inset 0 0 15px
        rgba(255, 180, 240, 0.08);

    backdrop-filter: blur(5px);

    transition:
        transform 0.3s ease,
        box-shadow 0.3s ease;

    animation:
        pinkFloat 4s ease-in-out infinite;
}


/* TAP / HOVER EFFECT */

.pink-discovery:hover {

    transform:
        scale(1.2);

    box-shadow:
        0 0 25px
        rgba(255, 170, 235, 0.8),
        0 0 45px
        rgba(180, 100, 255, 0.35);
}


/* FLOATING ANIMATION */

@keyframes pinkFloat {

    0% {

        transform:
            translateY(0px)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(-10px)
            rotate(3deg);

    }

    100% {

        transform:
            translateY(0px)
            rotate(0deg);

    }

}


/* =========================
   DISCOVERY POSITIONS
========================= */

.tulip-discovery {

    left: 17%;

    top: 25%;

    animation-delay: 0s;
}


.guitar-discovery {

    left: 68%;

    top: 22%;

    animation-delay: 0.8s;
}


.pepsi-discovery {

    left: 25%;

    top: 55%;

    animation-delay: 1.4s;
}


.constellation-discovery {

    left: 72%;

    top: 50%;

    animation-delay: 0.4s;
}


.shooting-discovery {

    left: 45%;

    top: 34%;

    animation-delay: 1.8s;
}


.butterfly-discovery {

    left: 55%;

    top: 68%;

    animation-delay: 1s;
}


/* =========================
   MOBILE POSITIONING
========================= */

@media (max-width: 600px) {

    .pink-discovery {

        width: 52px;

        height: 52px;

        font-size: 25px;

    }

}
</style>

</head>

<body>

<!-- =========================
     SPACE
========================= -->

<div id="space"></div>


<!-- SHOOTING STAR -->

<div class="shooting-star"></div>


<!-- =========================
     INTRO
========================= -->

<section id="intro">

    <div class="container">

        <div class="mission-number">

            NASA PERSONAL MISSION • 001

        </div>


        <h1>

            Mission: Leah 💜

        </h1>


        <p class="subtitle">

            Welcome to your universe Leah,
            there are a few things i wanted you to find.
         
         

        </p>


        <button
            class="launch-button"
            onclick="launchMission()">

            🚀 BEGIN MISSION

        </button>

    </div>

</section>


<!-- =========================
     UNIVERSE
========================= -->

<section id="universe">

    <div class="mission-label">

        MISSION: LEAH
        &nbsp;•&nbsp;
        STATUS: ACTIVE

    </div>


    <div 
       id="central-star"
       onclick="openPlanet('heart')">
          </div>
          
   <!-- PLANETS -->

<div class="orbit orbit-one"></div>

<div class="orbit orbit-two"></div>

<div class="orbit orbit-three"></div>


<!-- PLANET 1 -->

<div
    class="planet planet-one"
    onclick="openPlanet('memory')">

    <div class="planet-glow"></div>

</div>


<!-- PLANET 2 -->

<div
    class="planet planet-two"
    onclick="openPlanet('leah')">

    <div class="planet-glow"></div>

</div>


<!-- PLANET 3 -->

<div
    class="planet planet-three"
    onclick="openPlanet('music')">

    <div class="planet-glow"></div>

</div>


<!-- MOON -->

<div
    class="moon"
    onclick="openPlanet('moon')">

</div>

</section>

   <!-- =========================
     PINK PLANET UNIVERSE
========================= -->

<section id="pink-universe">

    <div class="pink-universe-title">
        LEAH'S LITTLE UNIVERSE
    </div>

    <div class="pink-universe-subtitle">
        Some things are worth discovering. 🌸
    </div>

   <!-- PINK PLANET DISCOVERIES -->

<div class="pink-discovery tulip-discovery"
     onclick="openPinkDiscovery('tulip')">
    🌷
</div>

<div class="pink-discovery guitar-discovery"
     onclick="openPinkDiscovery('guitar')">
    🎸
</div>

<div class="pink-discovery pepsi-discovery"
     onclick="openPinkDiscovery('pepsi')">
    🥤
</div>

<div class="pink-discovery constellation-discovery"
     onclick="openPinkDiscovery('constellation')">
    ✨
</div>

<div class="pink-discovery shooting-discovery"
     onclick="openPinkDiscovery('shooting')">
    ⭐
</div>

<div class="pink-discovery butterfly-discovery"
     onclick="openPinkDiscovery('butterfly')">
    🦋
</div>

    <button
        class="pink-back-button"
        onclick="closePinkUniverse()">
        ← RETURN
    </button>

</section>
<!-- =========================
     DISCOVERY SCREEN
========================= -->

<div id="discovery-screen">

   <div class="discovery-panel">

      <div class="discovery-label"
         id="discovery-label">
         MISSION DISCOVERY
      </div>

      <h2 id="discovery-title">
         TITLE
      </h2>

      <div class="discovery-line"></div>

      <p id="discovery-message">
         MESSAGE
      </p>

      <button
         class="close-discovery"
         onclick="closeDiscovery()">

         RETURN TO UNIVERSE

      </button>

   </div>

</div>

<script>

/* =========================
   CREATE STARS
========================= */

const space = document.getElementById("space");

for (let i = 0; i < 220; i++) {

    const star = document.createElement("div");

    star.classList.add("star");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.setProperty(
        "--speed",
        (2 + Math.random() * 5) + "s"
    );

    star.style.animationDelay =
        Math.random() * 5 + "s";

    space.appendChild(star);
}


/* =========================
   BIG STARS
========================= */

for (let i = 0; i < 18; i++) {

    const star = document.createElement("div");

    star.classList.add("big-star");

    star.style.left =
        Math.random() * 100 + "%";

    star.style.top =
        Math.random() * 100 + "%";

    star.style.animationDelay =
        Math.random() * 4 + "s";

    space.appendChild(star);
}


/* =========================
   LAUNCH MISSION
========================= */

function launchMission() {

    const intro =
        document.getElementById("intro");

    const universe =
        document.getElementById("universe");

    intro.classList.add("hidden");

    setTimeout(function() {

        universe.classList.add("active");

    }, 700);

}


/* =========================
   DISCOVERY WINDOW
========================= */

function openDiscovery(label, title, message) {

   document.getElementById("discovery-label").textContent = label;

   document.getElementById("discovery-title").textContent = title;

   document.getElementById("discovery-message").textContent = message;

   document.getElementById("discovery-screen").classList.add("active");
}

   function closeDiscovery() {

      document.getElementById("discovery-screen").classList.remove("active");
   }



/* =========================
   PLANET INTERACTIONS
========================= */

   function openPinkUniverse() {

    document
        .getElementById("pink-universe")
        .classList.add("active");

}


function closePinkUniverse() {

    document
        .getElementById("pink-universe")
        .classList.remove("active");

}

   /* =========================
   PINK PLANET DISCOVERIES
========================= */

function openPinkDiscovery(type) {

    if (type === "tulip") {

        openDiscovery(
            "PINK PLANET • DISCOVERY 01",
            "A FLOWER FOR LEAH",
            "Some things just suit certain people.\n\n" +
            "And somehow, tulips feel very you. 🌷"
        );

    }

    if (type === "guitar") {

        openDiscovery(
            "PINK PLANET • DISCOVERY 02",
            "A QUIET SOUND",
            "There's something about an acoustic guitar " +
            "that feels a little more personal.\n\n" +
